<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/dist/ag-grid-community.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #grid { width: 100%; height: 600px; }
</style>
</head>
<body>
<div id="grid"></div>
<script>
/* ---- Streamlit component wire protocol (hand-rolled, no streamlit-component-lib) ----
   Python -> here:  {type: "streamlit:render", args: {...}}
   here -> Python:   {type: "streamlit:componentReady", apiVersion: 1}
                      {type: "streamlit:setComponentValue", value: <json>}
                      {type: "streamlit:setFrameHeight", height: <number>}
*/
function sendToStreamlit(msg) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
}
function setComponentValue(value) {
  sendToStreamlit({ type: "streamlit:setComponentValue", value: value });
}
function setFrameHeight() {
  var h = document.body.scrollHeight;
  sendToStreamlit({ type: "streamlit:setFrameHeight", height: h });
}

var gridApi = null;
var lastFocusId = null;
var lastClearSeq = null;

var THEME = agGrid.themeQuartz.withParams({
  backgroundColor: "#111827",
  foregroundColor: "#f3f4f6",
  headerBackgroundColor: "#1f2937",
  headerTextColor: "#f3f4f6",
  oddRowBackgroundColor: "#161f2e",
  rowHoverColor: "#1f2937",
  selectedRowBackgroundColor: "#1e3a5f",
  borderColor: "#293548",
  accentColor: "#38bdf8",
  chromeBackgroundColor: "#111827",
});

function photoCellRenderer(params) {
  if (!params.value) { return ""; }
  var img = document.createElement("img");
  img.src = params.value;
  // Percentage/max-based sizing (not a fixed px square) so the thumbnail
  // actually grows when the user drags the column wider, instead of
  // leaving new empty space next to a still-tiny fixed-size image.
  img.style.height = "90%";
  img.style.maxHeight = "72px";
  img.style.width = "auto";
  img.style.maxWidth = "95%";
  img.style.objectFit = "cover";
  img.style.borderRadius = "4px";
  img.style.display = "block";
  img.style.margin = "3px auto";
  return img;
}

function getSelectedIds() {
  return gridApi.getSelectedRows().map(function (r) { return r.id; });
}

function reportSelection() {
  setComponentValue({ selected_ids: getSelectedIds(), open_id: null });
}

function openRow(data) {
  if (!data) { return; }
  setComponentValue({ selected_ids: getSelectedIds(), open_id: data.id });
}

/* Custom header component for the auto-generated selection column: a
   plain select-all-visible / deselect-all-visible toggle. This used to
   open a menu offering "this page only" vs "all pages" — meaningful back
   when the grid held a whole company's filtered result set and AG Grid's
   own client-side pagination just chunked it for display. Now the grid
   only ever holds one server-side page's worth of rows at a time (see
   app.py's Product List), so "this page" and "all pages" would be the
   same set of rows anyway — the menu was removed along with AG Grid's
   client-side pagination (see the pagination:false note above) to avoid
   presenting a distinction that no longer exists. Selecting rows beyond
   what's currently loaded is done via the checkboxes across pages
   (rex_selected_ids persists selections page to page — see app.py). */
function SelectAllHeaderComponent() {}

SelectAllHeaderComponent.prototype.init = function (params) {
  var self = this;
  this.params = params;

  this.eGui = document.createElement("div");
  this.eGui.style.cssText = "display:flex;align-items:center;justify-content:center;height:100%;width:100%;cursor:pointer;";

  this.checkbox = document.createElement("input");
  this.checkbox.type = "checkbox";
  this.checkbox.style.cursor = "pointer";
  this.checkbox.tabIndex = -1;
  // Purely visual: real checkboxes silently clear their own `.indeterminate`
  // flag as part of the browser's native pre-click handling, even when the
  // click event is preventDefault()-ed. Disabling pointer events on the
  // input means every click is instead handled by eGui below, and
  // `.checked`/`.indeterminate` are only ever set by our own
  // updateCheckboxState(), never touched by the browser.
  this.checkbox.style.pointerEvents = "none";
  this.eGui.appendChild(this.checkbox);

  this.onGuiClick = function (e) {
    e.preventDefault();
    e.stopPropagation();
    var stats = self.computeStats();
    if (stats.selected > 0) {
      self.params.api.deselectAllFiltered();
    } else {
      self.params.api.selectAllFiltered();
    }
  };
  this.eGui.addEventListener("click", this.onGuiClick);

  this.onStateEvent = function () { self.updateCheckboxState(); };
  params.api.addEventListener("selectionChanged", this.onStateEvent);
  params.api.addEventListener("modelUpdated", this.onStateEvent);

  this.updateCheckboxState();
};

SelectAllHeaderComponent.prototype.computeStats = function () {
  var total = 0, selected = 0;
  this.params.api.forEachNodeAfterFilter(function (node) {
    total++;
    if (node.isSelected()) { selected++; }
  });
  return { total: total, selected: selected };
};

SelectAllHeaderComponent.prototype.updateCheckboxState = function () {
  var stats = this.computeStats();
  this.checkbox.checked = stats.total > 0 && stats.selected === stats.total;
  this.checkbox.indeterminate = stats.selected > 0 && stats.selected < stats.total;
};

SelectAllHeaderComponent.prototype.getGui = function () { return this.eGui; };
SelectAllHeaderComponent.prototype.refresh = function () { return true; };

SelectAllHeaderComponent.prototype.destroy = function () {
  this.params.api.removeEventListener("selectionChanged", this.onStateEvent);
  this.params.api.removeEventListener("modelUpdated", this.onStateEvent);
};

var defaultColDef = { sortable: true, resizable: true, filter: true };

function priceCellFormatter(params) {
  var v = params.value;
  return (v === null || v === undefined || v === "") ? "" : "$" + Number(v).toFixed(2);
}

// Order matters: desktop's must-have set (photo, sku, name, quantity, price)
// comes first, left to right, matching the priority given in the spec;
// product_condition/status/date follow as additional desktop-only columns. Mobile hides
// everything outside MOBILE_VISIBLE_FIELDS below, regardless of order.
var columnDefs = [
  {
    field: "photo_url", headerName: "Photo", cellRenderer: photoCellRenderer,
    width: 110, minWidth: 60, maxWidth: 400, sortable: false, filter: false, resizable: true,
  },
  { field: "sku", headerName: "SKU", width: 110, minWidth: 90 },
  { field: "name", headerName: "Product Name", flex: 1, minWidth: 160 },
  { field: "brand", headerName: "Brand", width: 110, minWidth: 90 },
  { field: "quantity", headerName: "Qty", width: 90, minWidth: 70, type: "numericColumn" },
  { field: "price", headerName: "Price", width: 100, minWidth: 80, type: "numericColumn", valueFormatter: priceCellFormatter },
  { field: "product_condition", headerName: "Product Condition", width: 130, minWidth: 100 },
  { field: "triage", headerName: "Triage", width: 140, minWidth: 110 },
  { field: "location", headerName: "Location", width: 110, minWidth: 90 },
  { field: "baselinker", headerName: "BaseLinker", width: 120, minWidth: 100 },
  { field: "status", headerName: "Status", width: 130, minWidth: 110 },
  { field: "date", headerName: "Date", width: 120, minWidth: 100 },
];

// Mobile: show only the essentials (checkbox column is separate/always
// shown). Everything else collapses away rather than needing a distinct
// card-view layout — same grid, same data, fewer visible columns, and
// compact widths so those few columns actually fit a phone screen without
// a horizontal scroll (their normal desktop widths alone still add up to
// more than a typical phone viewport).
var MOBILE_VISIBLE_FIELDS = ["photo_url", "name", "price"];
var MOBILE_BREAKPOINT_PX = 700;
var wasMobile = false;
// Both variants set `hide` explicitly (true AND false) on every column —
// setGridOption("columnDefs", ...) merges new defs against AG Grid's
// existing internal column state rather than fully resetting it, so a
// colDef that never mentions `hide` at all does NOT clear a column that a
// previous columnDefs swap had hidden; it silently stays hidden.
var DESKTOP_COLUMN_DEFS = columnDefs.map(function (col) {
  return Object.assign({}, col, { hide: false });
});
var MOBILE_COLUMN_DEFS = columnDefs.map(function (col) {
  var c = Object.assign({}, col);
  c.hide = col.field !== "photo_url" && col.field !== "name" && MOBILE_VISIBLE_FIELDS.indexOf(col.field) === -1;
  if (col.field === "photo_url") { c.width = 56; }
  else if (col.field === "price") { c.width = 76; }
  return c;
});

// Bumped from v1: an earlier build of the responsive columns feature had a
// bug where mobile's column-hiding got persisted as if it were a real user
// preference (see the event.source check in onColumnMoved/onColumnResized
// below) — a new key means any browser that already saved that bad state
// starts clean instead of being stuck with columns wrongly hidden on
// desktop forever.
var COLUMN_STATE_KEY = "review_table_column_state_v2";

function saveColumnState() {
  try {
    localStorage.setItem(COLUMN_STATE_KEY, JSON.stringify(gridApi.getColumnState()));
  } catch (e) { /* localStorage unavailable — persistence just won't work this session */ }
}
function restoreColumnState() {
  try {
    var raw = localStorage.getItem(COLUMN_STATE_KEY);
    if (raw) { gridApi.applyColumnState({ state: JSON.parse(raw), applyOrder: true }); }
  } catch (e) { /* ignore malformed/missing saved state */ }
}

function applyResponsiveColumns() {
  if (!gridApi) { return; }
  // A width of 0 (or anything implausibly small) means the iframe hasn't
  // actually been laid out by the parent page yet — not a real "mobile"
  // reading. Trusting it caused a bogus lock into mobile mode on desktop
  // loads that only self-corrected once a later, much slower ResizeObserver
  // firing happened to catch the true width; skipping bogus reads instead
  // means desktop never mistakenly flips to mobile in the first place.
  if (window.innerWidth < 50) { return; }
  var mobile = window.innerWidth < MOBILE_BREAKPOINT_PX;
  if (mobile && !wasMobile) {
    // Redefine the whole columnDefs set rather than toggling visibility
    // and width as two separate API calls — applyColumnState() proved
    // unreliable for setting width on some columns immediately after a
    // visibility change on a fresh load, so the columnDefs themselves are
    // now the single source of truth for "what mobile looks like".
    gridApi.setGridOption("columnDefs", MOBILE_COLUMN_DEFS);
    gridApi.applyColumnState({ state: [{ colId: "ag-Grid-SelectionColumn", width: 36 }] });
  } else if (!mobile && wasMobile) {
    gridApi.setGridOption("columnDefs", DESKTOP_COLUMN_DEFS);
    gridApi.applyColumnState({ state: [{ colId: "ag-Grid-SelectionColumn", width: 50 }] });
    restoreColumnState(); // reapply any real saved user preference on top
  }
  wasMobile = mobile;
}

var _responsiveResizeTimer = null;
function scheduleResponsiveColumnsCheck() {
  if (_responsiveResizeTimer) { clearTimeout(_responsiveResizeTimer); }
  _responsiveResizeTimer = setTimeout(applyResponsiveColumns, 150);
}

var gridOptions = {
  theme: THEME,
  columnDefs: columnDefs,
  defaultColDef: defaultColDef,
  rowData: [],
  getRowId: function (params) { return params.data.id; },
  // Fixed height + AG Grid's own internal (virtualized) scrolling — NOT
  // "autoHeight" — so the mouse wheel scrolls rows inside the grid itself.
  // autoHeight instead grows the grid to fit every row and relies on the
  // page scrolling, which fought with a leftover fixed-height CSS rule and
  // left some rows unreachable.
  animateRows: true,
  rowHeight: 52,  // a bit taller than AG Grid's default so the Photo thumbnail is actually visible
  rowSelection: {
    mode: "multiRow",
    checkboxes: true,           // own dedicated (narrow, fixed) selection column, separate from Photo
    headerCheckbox: false,      // replaced by SelectAllHeaderComponent (this-page vs all-pages choice)
    enableClickSelection: true, // single click anywhere on the row also selects it
  },
  selectionColumnDef: {
    headerComponent: SelectAllHeaderComponent,
    sortable: false,
  },
  // No AG-Grid built-in pagination here (deliberately): this grid only
  // ever receives one server-side page's worth of rows at a time (see
  // app.py's Product List — inventory_store.list_products_paginated()),
  // so client-side re-paginating those already-bounded rows would just
  // add a second, confusing "Page X of Y" control on top of the real one
  // below the table — worse, one that silently caps at whatever fits
  // inside the current server page and can never reach the rest of the
  // inventory. Was removed after that exact confusion was reported (grid
  // showed "3 pages" and Next did nothing beyond them, independent of how
  // much more data actually existed server-side).
  onSelectionChanged: reportSelection,
  onRowDoubleClicked: function (event) { openRow(event.data); },
  onCellKeyDown: function (event) {
    var key = event.event ? event.event.key : null;
    if (key === "Enter") { openRow(event.data); }
  },
  // event.source guards against saving programmatic changes (responsive
  // column hiding, applyColumnState()'s own internal flex-width
  // recalculation, etc.) as if they were a real user preference — only
  // "ui*" sources are an actual drag by the user's mouse.
  onColumnMoved: function (event) { if (event.finished && event.source === "uiColumnMoved") { saveColumnState(); } },
  onColumnResized: function (event) { if (event.finished && event.source === "uiColumnResized") { saveColumnState(); } },
};

document.addEventListener("DOMContentLoaded", function () {
  gridApi = agGrid.createGrid(document.getElementById("grid"), gridOptions);
  restoreColumnState();
  applyResponsiveColumns();
  // ResizeObserver, not window's own "resize" event: at DOMContentLoaded
  // time Streamlit hasn't necessarily finished sizing this iframe to match
  // its final container width yet (it can still be at the browser's
  // default ~300px), so the single applyResponsiveColumns() call above can
  // read a stale width and wrongly latch into mobile mode with nothing to
  // correct it afterward — window "resize" only fires on later changes, not
  // on that initial layout convergence. ResizeObserver instead re-fires
  // immediately once the real size is known, and on every change after.
  if (window.ResizeObserver) {
    new ResizeObserver(scheduleResponsiveColumnsCheck).observe(document.documentElement);
  } else {
    window.addEventListener("resize", scheduleResponsiveColumnsCheck);
  }

  sendToStreamlit({ type: "streamlit:componentReady", apiVersion: 1 });
  setTimeout(setFrameHeight, 100);
});

window.addEventListener("message", function (event) {
  var data = event.data;
  if (!data || data.type !== "streamlit:render") { return; }
  var args = data.args || {};
  var rows = args.rows || [];
  if (!gridApi) { return; }
  gridApi.setGridOption("rowData", rows);

  if (lastClearSeq === null) {
    lastClearSeq = args.clear_seq;
  } else if (args.clear_seq !== lastClearSeq) {
    lastClearSeq = args.clear_seq;
    gridApi.deselectAll();
  }

  var focusId = args.focus_id;
  if (focusId && focusId !== lastFocusId) {
    lastFocusId = focusId;
    setTimeout(function () {
      var node = gridApi.getRowNode(focusId);
      if (node) {
        gridApi.ensureNodeVisible(node, "middle");
        gridApi.setFocusedCell(node.rowIndex, "sku");
        gridApi.flashCells({ rowNodes: [node] });
      }
    }, 60);
  }
  setTimeout(setFrameHeight, 50);
});
</script>
</body>
</html>
